<html>
<head>

</head>
<body>
    <div id="login">
        <h1>🔐 Вход в систему</h1>
        <p style="color: #666; font-size: 12px; text-align: center; margin-bottom: 20px;">
            Логин: <strong style="color: #4af;">dbsvc_A9xR7QmL4VpN82</strong><br>
            Пароль: <strong style="color: #4af;">Y#8vQ!2mL@7xP$4rN^9kW&5cT*1zHf6JbXs</strong>
        </p>
        <input id="username" placeholder="Логин">

        <button onclick="login()">Войти</button>

    <div id="dashboard" style="display:none">

            <input id="filterAgeMax" placeholder="Возраст до" type="number">
            <select id="filterSex">
                <option value="">Пол</option>
                <option value="male">Мужской</option>
                <option value="female">Женский</option>
            </select>
            <input id="filterStatus" placeholder="Статус">
            <select id="filterSource">
                <option value="">Источник</option>
                <option value="FBI">FBI</option>
                <option value="INTERPOL">INTERPOL</option>
            </select>
            <button onclick="loadData()">🔍 Поиск</button>
        </div>
        
        <div id="results"></div>
