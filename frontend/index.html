<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0e17">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>Global Wanted Database</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login">
        <h1>🔐 Login</h1>
        <p class="subtitle">Global Wanted Database</p>
        <input id="username" type="text" placeholder="Username" autocomplete="username">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password">
        <button onclick="login()">Login</button>
        <p id="errorMsg"></p>
    </div>

    <div id="dashboard" style="display:none">
        <div class="header">
            <h1>🌍 Global Wanted Database</h1>
            <div class="header-right">
                <button onclick="showAddPerson()" class="btn-add">➕ Add Person</button>
                <button onclick="logout()" class="btn-logout">🚪 Logout</button>
            </div>
        </div>

        <div id="stats">Loading...</div>

        <div class="filters">
            <input id="filterName" placeholder="First / Last Name">
            <input id="filterCountry" placeholder="Country">
            <input id="filterAgeMin" placeholder="Age from" type="number">
            <input id="filterAgeMax" placeholder="Age to" type="number">
            <select id="filterSex">
                <option value="">Sex</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <select id="filterCategory">
                <option value="">Category</option>
                <option value="terrorism">Terrorism</option>
                <option value="violent">Violent</option>
                <option value="sexual">Sexual</option>
                <option value="cyber">Cyber</option>
                <option value="financial">Financial</option>
                <option value="organized">Organized Crime</option>
                <option value="drug">Drug</option>
                <option value="kidnapping">Kidnapping</option>
                <option value="missing">Missing</option>
                <option value="corruption">Corruption</option>
                <option value="no_crime">Clean Record</option>
            </select>
            <select id="filterStatus">
                <option value="">Status</option>
                <option value="active">Wanted</option>
                <option value="captured">Captured</option>
                <option value="deceased">Deceased</option>
                <option value="located">Located</option>
                <option value="clean">Clean Record</option>
            </select>
            <select id="filterSource">
                <option value="">All Sources</option>
                <option value="FBI">FBI</option>
                <option value="INTERPOL">INTERPOL</option>
                <option value="US Marshals">US Marshals</option>
                <option value="Europol">Europol</option>
                <option value="Miami-Dade Jail">Miami-Dade Jail</option>
                <option value="Miami-Dade Sex Offender Registry">Miami Sex Offenders</option>
                <option value="Miami-Dade Police">Miami-Dade Police</option>
                <option value="Detroit Police">Detroit Police</option>
                <option value="OffenderList">OffenderList</option>
                <option value="Mexico PGR">Mexico PGR</option>
                <option value="My DB">My DB</option>
            </select>
            <button onclick="loadData()" class="btn-search">🔍 Search</button>
            <button onclick="clearFilters()" class="btn-clear">🧹 Clear</button>
        </div>

        <div id="results"></div>
    </div>

    <div id="profileModal" style="display:none;">
        <div>
            <div id="profileContent"></div>
        </div>
    </div>

    <div id="addModal" style="display:none;">
        <div>
            <h2>➕ Add Person</h2>
            <input id="addFirstName" placeholder="First Name">
            <input id="addLastName" placeholder="Last Name">
            <input id="addDob" type="date" placeholder="Date of Birth">
            <input id="addAddress" placeholder="Address">
            <input id="addCity" placeholder="City">
            <input id="addCountry" placeholder="Country">
            <input id="addPhone" placeholder="Phone">
            <input id="addCrime" placeholder="Crime">
            <input id="addCharges" placeholder="Charges (comma separated)">
            <select id="addCategory">
                <option value="terrorism">Terrorism</option>
                <option value="violent">Violent</option>
                <option value="sexual">Sexual</option>
                <option value="cyber">Cyber</option>
                <option value="financial">Financial</option>
                <option value="organized">Organized Crime</option>
                <option value="drug">Drug</option>
                <option value="kidnapping">Kidnapping</option>
                <option value="missing">Missing</option>
                <option value="corruption">Corruption</option>
                <option value="no_crime">Clean Record</option>
            </select>
            <select id="addStatus">
                <option value="active">Wanted</option>
                <option value="captured">Captured</option>
                <option value="deceased">Deceased</option>
                <option value="located">Located</option>
                <option value="clean">Clean Record</option>
            </select>
            <select id="addSex">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <div class="form-actions">
                <button onclick="addPerson()" class="btn-submit">✅ Add</button>
                <button onclick="closeAddPerson()" class="btn-cancel">❌ Cancel</button>
            </div>
        </div>
    </div>

    <div id="adminPanel" style="display:none;">
        <div>
            <div class="admin-header">
                <h2>🔐 Admin Panel</h2>
                <button onclick="closeAdmin()" class="btn-close-admin">✖ Close</button>
            </div>
            <div id="adminContent">
                <h3>📊 Login History</h3>
                <table id="adminLogTable">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>IP Address</th>
                            <th>Country</th>
                            <th>Time</th>
                            <th>User Agent</th>
                        </tr>
                    </thead>
                    <tbody id="adminLogBody"></tbody>
                </table>
                <hr>
                <h3>👥 Manage Users</h3>
                <div class="admin-user-form">
                    <input id="adminNewUser" placeholder="New Username">
                    <input id="adminNewPass" placeholder="New Password" type="password">
                    <select id="adminNewRole">
                        <option value="user">👤 User (access to DB only)</option>
                        <option value="admin">👑 Admin (full access)</option>
                    </select>
                    <button onclick="addUser()" class="btn-add-user">➕ Add User</button>
                </div>
                <div id="adminUserList"></div>
                <hr>
                <p style="color: #6a7a8a; font-size: 12px; margin-top: 10px;">
                    👤 Users can only view database data<br>
                    👑 Admins can manage users and view logs
                </p>
            </div>
        </div>
    </div>

    <div id="adminButton" style="display:none;position:fixed;bottom:20px;right:20px;z-index:999;">
        <button onclick="openAdmin()" class="admin-fab">🔐</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
