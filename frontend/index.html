<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0a0e17">
    <meta name="description" content="Global Wanted Database — полицейская база данных розыска">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/favicon.ico">
    <title>Global Wanted Database</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== СТРАНИЦА ВХОДА ===== -->
    <div id="login">
        <h1>🔐 Вход</h1>
        <p class="subtitle">Global Wanted Database</p>
        <div class="lang-select">
            <button onclick="setLang('ru')" class="lang-btn" id="langRu">🇷🇺 RU</button>
            <button onclick="setLang('en')" class="lang-btn" id="langEn">🇬🇧 EN</button>
        </div>
        <input id="username" type="text" placeholder="Логин" autocomplete="username">
        <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
        <button onclick="login()">Войти</button>
        <p id="errorMsg"></p>
    </div>

    <!-- ===== ПАНЕЛЬ УПРАВЛЕНИЯ ===== -->
    <div id="dashboard" style="display:none">
        <div class="header">
            <h1>🌍 Global Wanted Database</h1>
            <div class="header-right">
                <div class="lang-select">
                    <button onclick="setLang('ru')" class="lang-btn">🇷🇺</button>
                    <button onclick="setLang('en')" class="lang-btn">🇬🇧</button>
                </div>
                <button onclick="showAddPerson()" class="btn-add">➕ Добавить</button>
                <button onclick="logout()" class="btn-logout">🚪 Выйти</button>
            </div>
        </div>

        <div id="stats">Загрузка...</div>

        <div class="filters">
            <input id="filterName" placeholder="Имя / Фамилия">
            <input id="filterCountry" placeholder="Страна">
            <input id="filterAgeMin" placeholder="Возраст от" type="number">
            <input id="filterAgeMax" placeholder="Возраст до" type="number">
            <select id="filterSex">
                <option value="">Пол</option>
                <option value="male">Мужской</option>
                <option value="female">Женский</option>
            </select>
            <select id="filterCategory">
                <option value="">Категория</option>
                <option value="terrorism">Терроризм</option>
                <option value="violent">Насильственные</option>
                <option value="sexual">Сексуальные</option>
                <option value="cyber">Кибер</option>
                <option value="financial">Финансовые</option>
                <option value="organized">Орг. преступность</option>
                <option value="drug">Наркотики</option>
                <option value="kidnapping">Похищения</option>
                <option value="missing">Пропавшие</option>
                <option value="corruption">Коррупция</option>
                <option value="no_crime">Без судимости</option>
            </select>
            <select id="filterStatus">
                <option value="">Статус</option>
                <option value="active">В розыске</option>
                <option value="captured">Задержан</option>
                <option value="deceased">Умер</option>
                <option value="located">Найден</option>
                <option value="clean">Без судимости</option>
            </select>
            <select id="filterSource">
                <option value="">Источник</option>
                <option value="FBI">FBI</option>
                <option value="INTERPOL">INTERPOL</option>
                <option value="Miami-Dade Jail">Miami Jail</option>
                <option value="Miami-Dade Sex Offender Registry">Miami Sex</option>
                <option value="US Marshals">US Marshals</option>
                <option value="Europol">Europol</option>
                <option value="Моя БД">Моя БД</option>
            </select>
            <button onclick="loadData()" class="btn-search">🔍 Поиск</button>
            <button onclick="clearFilters()" class="btn-clear">🧹 Очистить</button>
        </div>

        <div id="results"></div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО КАРТОЧКИ ===== -->
    <div id="profileModal" style="display:none;">
        <div>
            <div id="profileContent"></div>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ ===== -->
    <div id="addModal" style="display:none;">
        <div>
            <h2>➕ Добавить человека</h2>
            <input id="addFirstName" placeholder="Имя">
            <input id="addLastName" placeholder="Фамилия">
            <input id="addDob" type="date" placeholder="Дата рождения">
            <input id="addAddress" placeholder="Адрес">
            <input id="addCity" placeholder="Город">
            <input id="addCountry" placeholder="Страна">
            <input id="addPhone" placeholder="Телефон">
            <input id="addCrime" placeholder="Преступление">
            <input id="addCharges" placeholder="Статьи (через запятую)">
            <select id="addCategory">
                <option value="terrorism">Терроризм</option>
                <option value="violent">Насильственные</option>
                <option value="sexual">Сексуальные</option>
                <option value="cyber">Кибер</option>
                <option value="financial">Финансовые</option>
                <option value="organized">Орг. преступность</option>
                <option value="drug">Наркотики</option>
                <option value="kidnapping">Похищения</option>
                <option value="missing">Пропавшие</option>
                <option value="corruption">Коррупция</option>
                <option value="no_crime">Без судимости</option>
            </select>
            <select id="addStatus">
                <option value="active">В розыске</option>
                <option value="captured">Задержан</option>
                <option value="deceased">Умер</option>
                <option value="located">Найден</option>
                <option value="clean">Без судимости</option>
            </select>
            <select id="addSex">
                <option value="male">Мужской</option>
                <option value="female">Женский</option>
            </select>
            <div class="form-actions">
                <button onclick="addPerson()" class="btn-submit">✅ Добавить</button>
                <button onclick="closeAddPerson()" class="btn-cancel">❌ Отмена</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
